Node-RED から SendGrid サービスを使ってメールを送信します。

### 入力プロパティ

- **msg.from** (`string`): 送信者メールアドレス
- **msg.to** (`string`): 宛先メールアドレス
- **msg.cc** (`string`, オプション): CC（カーボンコピー）宛先
- **msg.bcc** (`string`, オプション): BCC（ブラインドカーボンコピー）宛先
- **msg.topic** (`string`): メール件名（`msg.subject` も可）
- **msg.payload** (`string`): メール本文（プレーンテキストまたはHTML、ノード設定による）
- **msg.attachments** (`Buffer | Array | Object`, オプション): 添付ファイル。1つの場合は Buffer、複数の場合は Buffer または SendGrid 形式のオブジェクトの配列。Buffer の場合、ファイル名は自動生成されますが、`att.filename` または `msg.filenames`（Bufferと同じ順序の配列）で指定可能です。
- **msg.templateId** (`string`, オプション): SendGrid ダイナミックテンプレートID
- **msg.templateData** (`object | string`, オプション): ダイナミックテンプレート用データ



### 詳細

このノードの使い方:

1. Node-RED パレットマネージャーから（`@gemini86/node-red-sendgrid`）をインストールします。
2. [SendGrid](https://sendgrid.com/) からAPIキーを取得します。
3. ノードの設定画面にAPIキーを貼り付けます。
4. 必要なメッセージプロパティをフローで設定します。

#### 添付ファイル

添付ファイルを追加するには、`msg.attachments` を配列として設定してください:

- 配列の各要素は Buffer（ファイル内容）または SendGrid 形式のオブジェクト（下記参照）である必要があります。
- Buffer の場合、ファイル名は自動生成されます（例: attachment-1.pdf）。ファイル名を指定したい場合は、SendGrid オブジェクトで `filename` プロパティを設定してください。
- Buffer と SendGrid オブジェクトを同じ配列内で混在させることができます。
- `msg.payload` は常にメール本文（プレーンテキストまたはHTML、ノード設定による）として使用され、添付ファイルにはなりません。

**SendGrid 添付ファイルオブジェクト例:**

```js
{
  content: "<base64-encoded string>",
  filename: "document.pdf",
  type: "application/pdf", // オプション
  disposition: "attachment", // オプション
  content_id: "unique-id" // オプション
}
```

### 不正な添付ファイルのスキップ

有効にすると、正しく処理できない添付ファイルはスキップされ、ノードはエラーにならず警告のみが記録されます。無効の場合、最初の不正な添付ファイルでノードがエラーになります。

**注意:** 以前の `msg.payload` を Buffer として添付ファイルに使う方法はサポートされません。必ず `msg.attachments` を使用してください。
