<script type="text/markdown" data-help-name="gemini86-sendgrid">
Send e-mails using the SendGrid service from Node-RED.

### Inputs

- **msg.from** (`string`): Sender e-mail address
- **msg.to** (`string`): Recipient e-mail address
- **msg.cc** (`string`, optional): Carbon copy recipient(s)
- **msg.bcc** (`string`, optional): Blind carbon copy recipient(s)
- **msg.topic** (`string`): E-mail subject (or use `msg.subject`)
- **msg.payload** (`string`): E-mail body (plain text or HTML, depending on node config)
- **msg.attachments** (`Buffer | Array | Object`, optional): One or more attachments. Use a Buffer for a single attachment, or an array of Buffers/objects for multiple. Objects must match SendGrid's attachment format. Filenames are auto-generated unless provided.
- **msg.templateId** (`string`, optional): SendGrid dynamic template ID
- **msg.templateData** (`object | string`, optional): Data for dynamic template

### Details

To use this node:

1. Install via the Node-RED palette manager (`@gemini86/node-red-sendgrid`).
2. Get an API key from [SendGrid](https://sendgrid.com/).
3. Paste the API key into the node's configuration.
4. Configure your flow to set the required message properties.

#### Attachments

To add attachments, set `msg.attachments` to an array:

- Each item in the array must be either a Buffer (for file content) or an object in SendGrid's attachment format (see below).
- For Buffers, filenames are auto-generated (e.g., attachment-1.pdf). To specify a filename, use a SendGrid object and set its `filename` property.
- You may mix Buffers and SendGrid objects in the same array.
- `msg.payload` is always used as the e-mail body (plain text or HTML, depending on node config) and is never treated as an attachment.

**SendGrid attachment object example:**

```js
{
  content: "<base64-encoded string or raw buffer>",
  filename: "document.pdf",
  type: "application/pdf", // optional
  disposition: "attachment", // optional, use "inline" for inline attachments embedded in the email body
  content_id: "unique-id" // optional
}
```

### Skip Bad Attachments

If enabled, attachments that cannot be normalized (invalid or unsupported) will be skipped and a warning will be logged instead of failing the node. If disabled, the node will error on the first bad attachment.

**Note:** Legacy usage of `msg.payload` as a Buffer for attachments is no longer supported. Always use `msg.attachments` for attachments.

### References

- [SendGrid documentation](https://sendgrid.com/docs/)
- [Node-RED documentation](https://nodered.org/docs/)
- [GitHub repository](https://github.com/gemini86/node-red-sendgrid)
